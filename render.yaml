services:
  - type: web
    name: protrader-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 16 --worker-class gthread --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
